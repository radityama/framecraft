<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../../assets/fonts/fonts.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f3ecd9; color: #292d29; }
    body { font-family: "IBM Plex Sans", sans-serif; }
    main { position: relative; height: 100%; }
    .folio { position: absolute; top: 48px; left: 64px; font-size: 18px; letter-spacing: .13em; }
    .seal { position: absolute; top: 120px; left: 380px; width: 200px; height: 200px; box-sizing: border-box; border: 13px solid #c75b42; border-radius: 50%; }
    h1 { position: absolute; top: 338px; left: 63px; width: 834px; margin: 0; text-align: center; font: 400 90px/1 "IBM Plex Serif", serif; letter-spacing: -.07em; }
    .rule { position: absolute; left: 64px; right: 64px; bottom: 61px; height: 2px; background: #292d29; }
    .caption { position: absolute; right: 64px; bottom: 74px; font-size: 19px; }
  </style>
</head>
<body>
  <main>
    <div class="folio">PLATE 02 / RECEPTION</div>
    <div class="seal"></div>
    <h1>Received.</h1>
    <div class="caption">The loop is closed.</div>
    <div class="rule"></div>
  </main>
  <script src="../../../../runtime.js"></script>
  <script>
    const seal = document.querySelector('.seal');
    const title = document.querySelector('h1');
    window.framecraft.shot({renderFrame({progress}) {
      seal.style.transform = `scale(${0.25 + 0.75 * progress})`;
      seal.style.opacity = String(0.45 + 0.55 * progress);
      title.style.transform = `translateY(${20 * (1 - progress)}px)`;
      title.style.opacity = String(0.6 + 0.4 * progress);
    }});
  </script>
</body>
</html>
