<!doctype html><html lang="en"><meta charset="utf-8"><body><main id="label"></main>
<script src="../../projects/demo/runtime.js"></script><script>
window.framecraft.shot({
  async prepare() { document.body.dataset.prepared = String(Number(document.body.dataset.prepared || 0) + 1); },
  renderFrame(ctx) { document.querySelector('#label').textContent = String(ctx.frame); },
  dispose() { document.body.dataset.disposed = 'yes'; }
});
</script></body></html>
