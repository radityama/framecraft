<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>commit</title>
<style>
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --accent: #7ee787;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
  }
  .terminal {
    position: absolute;
    left: 240px;
    top: 420px;
    width: 1200px;
    font-size: 56px;
    line-height: 1.5;
    letter-spacing: -0.01em;
  }
  .command {
    color: var(--fg);
    white-space: pre;
  }
  .prompt {
    color: var(--accent);
  }
  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.1em;
    margin-left: 0.08em;
    vertical-align: -0.18em;
    background: var(--fg);
    animation: blink 1s steps(1, end) infinite;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .output {
    color: var(--accent);
    animation: rise 1s ease-out 2s both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .rule {
    width: 1200px;
    height: 4px;
    margin-top: 26px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
  }
</style>
</head>
<body>
  <div class="terminal">
    <div class="command"><span class="prompt">$</span> <span id="typed"></span><span class="cursor"></span></div>
    <div class="output" id="output">[main 4f2a9c1] ship it</div>
    <div class="rule" id="rule"></div>
  </div>

  <script src="../../../../runtime.js"></script>
  <script src="../../../../assets/vendor/gsap.min.js"></script>
  <script>
    const COMMAND = 'git commit -m "ship it"';
    const typed = document.getElementById('typed');
    const rule = document.getElementById('rule');

    const timeline = gsap.timeline({ paused: true });
    timeline.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 1, ease: 'none' }, 3);

    window.framecraft.shot({
      timelines: [timeline],
      renderFrame(ctx) {
        const typedChars = Math.min(COMMAND.length, Math.floor((ctx.frame / 60) * COMMAND.length));
        typed.textContent = COMMAND.slice(0, typedChars);
      },
      dispose() {
        timeline.kill();
      }
    });
  </script>
</body>
</html>
